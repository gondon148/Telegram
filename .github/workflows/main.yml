name: Build Telegram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keystore
        run: keytool -genkey -v -keystore release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=App,OU=App,O=App,L=City,S=State,C=US"

      - name: Build APK
        run: ./gradlew assembleAfatRelease -Dorg.gradle.warning.mode=none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: TMessagesProj_App/build/outputs/apk/
