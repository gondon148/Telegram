name: Build Telegram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=My,OU=My,O=My,L=My,S=My,C=US"
          cp my.keystore TMessagesProj_App/

      - name: Build APK
        run: ./gradlew assembleAfatRelease -Dorg.gradle.warning.mode=none
        env:
          KEYSTORE_PATH: my.keystore
          KEYSTORE_PASSWORD: mypassword
          KEY_ALIAS: mykey
          KEY_PASSWORD: mypassword

      - name: Upload APK
        uses: actions
